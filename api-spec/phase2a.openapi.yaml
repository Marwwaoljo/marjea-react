openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: >
    Institution-authenticated semantic integration. Demo preparation/reset
    remain unmounted. Semantic mutations require an institution-scoped enabled flag,
    authenticated membership and the documented role. Missing flag means OFF.
servers: [{url: /api}]
paths: {}
components:
  securitySchemes:
    ClerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk verified session; browser sessions may use Clerk session cookies.
  parameters:
    InstitutionId: {name: institutionId, in: path, required: true, schema: {type: string, format: uuid}}
    AnalysisId: {name: analysisId, in: path, required: true, schema: {type: string, format: uuid}}
    StepId: {name: stepId, in: path, required: true, schema: {type: string, format: uuid}}
    CandidateId: {name: candidateId, in: path, required: true, schema: {type: string, format: uuid}}
    ReferenceFilter: {name: officialReferenceId, in: query, schema: {type: string, format: uuid}}
    DatasetFilter: {name: datasetScope, in: query, schema: {type: string, maxLength: 160}}
  responses:
    BadRequest: {description: Invalid input or pair not belonging to the same institution, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticProblem"}}}}
    Unauthorized: {description: Verified Clerk session required, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticProblem"}}}}
    Forbidden: {description: "Membership, role or institution feature flag does not permit this operation", content: {application/json: {schema: {$ref: "#/components/schemas/SemanticProblem"}}}}
    NotFound: {description: Entity unavailable within the authorized institution, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticProblem"}}}}
    Conflict: {description: "Invalid state, duplicate decision, stale coverage or unresolved older observations", content: {application/json: {schema: {$ref: "#/components/schemas/SemanticProblem"}}}}
    Unavailable: {description: Provider not configured or temporarily unavailable; never a fabricated successful result, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticProblem"}}}}
  pathItems:
    AuditEvents:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      get:
        operationId: listInstitutionAuditEvents
        security: [{ClerkSession: []}]
        tags: [institutions]
        description: Read-only committed audit events for tenant_admin and auditor members. Raw metadata and source content are never returned. A change reason is included only for tenant_admin on semantic_attempt_limit_changed events.
        parameters:
          - {name: from, in: query, schema: {type: string, format: date-time}}
          - {name: to, in: query, schema: {type: string, format: date-time}}
          - {name: action, in: query, schema: {type: string, maxLength: 120}}
          - {name: entityKind, in: query, schema: {type: string, maxLength: 80}}
          - {name: entityId, in: query, schema: {type: string, format: uuid}}
          - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
          - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
        responses:
          "200": {description: Institution-scoped committed audit events, content: {application/json: {schema: {$ref: "#/components/schemas/AuditEventsPage"}}}}
          "400": {$ref: "#/components/responses/BadRequest"}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
    InstitutionAnalytics:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      get:
        operationId: getInstitutionAnalytics
        security: [{ClerkSession: []}]
        tags: [institutions]
        description: Tenant-admin and auditor read-only aggregate report; excludes demo records and never returns source content.
        parameters:
          - {name: days, in: query, required: true, schema: {type: integer, enum: [30, 90, 365]}}
        responses:
          "200": {description: Institution-scoped aggregate analytics, content: {application/json: {schema: {$ref: "#/components/schemas/InstitutionAnalytics"}}}}
          "400": {$ref: "#/components/responses/BadRequest"}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
    Capabilities:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      get:
        operationId: getSemanticCapabilities
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: Any institution member. Read-only; no provider secrets returned.
        responses:
          "200": {description: Flag and provider readiness are independent, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticCapabilities"}}}}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
    SemanticAttemptHistory:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      get:
        operationId: listSemanticAttemptHistory
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: Tenant-admin-only history of conservative reservations and worker outcomes. These events do not represent provider billing.
        parameters:
          - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
          - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
        responses:
          "200": {description: Institution-scoped reservation and outcome history, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticAttemptHistoryPage"}}}}
          "400": {$ref: "#/components/responses/BadRequest"}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
    ReferenceObservations:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      get:
        operationId: listReferenceObservations
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: Any member; scoped to this institution only.
        parameters: [{$ref: "#/components/parameters/ReferenceFilter"}, {$ref: "#/components/parameters/DatasetFilter"}]
        responses:
          "200": {description: Explicitly linked reference/content pairs, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ReferenceObservation"}}}}}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
      post:
        operationId: createReferenceObservation
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: tenant_admin or analyst; feature flag required. Server derives actor and dataset scope.
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReferenceObservationInput"}}}}
        responses:
          "201": {description: Linked pair, content: {application/json: {schema: {$ref: "#/components/schemas/ReferenceObservation"}}}}
          "400": {$ref: "#/components/responses/BadRequest"}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
          "409": {$ref: "#/components/responses/Conflict"}
    Analyses:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      get:
        operationId: listSemanticAnalyses
        security: [{ClerkSession: []}]
        tags: [semantic]
        parameters: [{$ref: "#/components/parameters/ReferenceFilter"}, {$ref: "#/components/parameters/DatasetFilter"}]
        responses:
          "200": {description: Institution analysis history; any member, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/SemanticAnalysis"}}}}}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
      post:
        operationId: createSemanticAnalysis
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: >
          tenant_admin or analyst; flag required. Server takes exact snapshots,
          computes hash and selects engine version. Identical input returns the
          existing record, never overwrites it. No external provider call inside the transaction.
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticAnalysisInput"}}}}
        responses:
          "202": {description: New analysis queued, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticAnalysis"}}}}
          "200": {description: Existing identical analysis, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticAnalysis"}}}}
          "400": {$ref: "#/components/responses/BadRequest"}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
          "409": {$ref: "#/components/responses/Conflict"}
          "503": {$ref: "#/components/responses/Unavailable"}
    AnalysisDetail:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}, {$ref: "#/components/parameters/AnalysisId"}]
      get:
        operationId: getSemanticAnalysis
        security: [{ClerkSession: []}]
        tags: [semantic]
        responses:
          "200": {description: "Exact historical inputs, machine result and human review; any member", content: {application/json: {schema: {$ref: "#/components/schemas/SemanticAnalysis"}}}}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
          "404": {$ref: "#/components/responses/NotFound"}
    AnalysisRetry:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}, {$ref: "#/components/parameters/AnalysisId"}]
      post:
        operationId: retrySemanticAnalysis
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: tenant_admin or analyst; flag required. Only failed jobs; retains immutable inputs and record ID.
        responses:
          "202": {description: Same analysis requeued, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticAnalysis"}}}}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
          "404": {$ref: "#/components/responses/NotFound"}
          "409": {$ref: "#/components/responses/Conflict"}
          "503": {$ref: "#/components/responses/Unavailable"}
    AnalysisReview:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}, {$ref: "#/components/parameters/AnalysisId"}]
      post:
        operationId: createSemanticReviewStep
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: >
          tenant_admin; flag required. Case must match the analysis pair.
          Eligible reviewer/administrator must not be requestedBy.
          Uses marjea_review_steps, not an independent review engine.
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticReviewStepInput"}}}}
        responses:
          "201": {description: Reviewer assigned in current round, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticReviewStep"}}}}
          "400": {$ref: "#/components/responses/BadRequest"}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
          "404": {$ref: "#/components/responses/NotFound"}
          "409": {$ref: "#/components/responses/Conflict"}
    AnalysisDecision:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}, {$ref: "#/components/parameters/AnalysisId"}, {$ref: "#/components/parameters/StepId"}]
      post:
        operationId: submitSemanticReviewDecision
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: >
          Assigned reviewer or assigned tenant_admin; flag required and requester
          self-review prohibited. Atomic step decision and analysis status update.
          Never approves a response draft or closes a case.
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticReviewDecisionInput"}}}}
        responses:
          "200": {description: Recorded review decision, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticReviewStep"}}}}
          "400": {$ref: "#/components/responses/BadRequest"}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
          "404": {$ref: "#/components/responses/NotFound"}
          "409": {$ref: "#/components/responses/Conflict"}
    AnalysisResubmit:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}, {$ref: "#/components/parameters/AnalysisId"}]
      post:
        operationId: resubmitSemanticAnalysis
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: tenant_admin or analyst; flag required. Revision-requested only; new review round preserving earlier decisions and machine result.
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticResubmissionInput"}}}}
        responses:
          "200": {description: Resubmitted analysis, content: {application/json: {schema: {$ref: "#/components/schemas/SemanticAnalysis"}}}}
          "400": {$ref: "#/components/responses/BadRequest"}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
          "404": {$ref: "#/components/responses/NotFound"}
          "409": {$ref: "#/components/responses/Conflict"}
    Deviations:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      get:
        operationId: listFirstObservedDeviations
        security: [{ClerkSession: []}]
        tags: [semantic]
        parameters: [{$ref: "#/components/parameters/ReferenceFilter"}, {$ref: "#/components/parameters/DatasetFilter"}]
        description: Any member. Never claims first on the internet.
        responses:
          "200": {description: Candidates and historical decisions, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/FirstObservedDeviation"}}}}}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
    DeviationConfirm:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}, {$ref: "#/components/parameters/CandidateId"}]
      post:
        operationId: confirmFirstObservedDeviation
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: >
          tenant_admin or reviewer; flag required. Human confirmation after locking
          and revalidating all older eligible observations for this reference
          version/dataset/engine. Unresolved, failed or stale older analyses block.
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DeviationDecisionInput"}}}}
        responses:
          "200": {description: Human-confirmed coverage, content: {application/json: {schema: {$ref: "#/components/schemas/FirstObservedDeviation"}}}}
          "400": {$ref: "#/components/responses/BadRequest"}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
          "404": {$ref: "#/components/responses/NotFound"}
          "409": {$ref: "#/components/responses/Conflict"}
    DeviationReject:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}, {$ref: "#/components/parameters/CandidateId"}]
      post:
        operationId: rejectFirstObservedDeviation
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: tenant_admin or reviewer; flag required. Rejection is not proof that an older observation has no deviation.
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DeviationDecisionInput"}}}}
        responses:
          "200": {description: Human-rejected candidate, content: {application/json: {schema: {$ref: "#/components/schemas/FirstObservedDeviation"}}}}
          "400": {$ref: "#/components/responses/BadRequest"}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
          "404": {$ref: "#/components/responses/NotFound"}
          "409": {$ref: "#/components/responses/Conflict"}
    DemoPrepare:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      post:
        operationId: prepareOfuqDemo
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: tenant_admin only; flag required. Explicit preparation, never startup seeding.
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DemoPreparationInput"}}}}
        responses:
          "200": {description: Idempotently prepared current scenario generation, content: {application/json: {schema: {$ref: "#/components/schemas/DemoScenario"}}}}
          "400": {$ref: "#/components/responses/BadRequest"}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
          "409": {$ref: "#/components/responses/Conflict"}
    DemoReset:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      post:
        operationId: resetOfuqDemo
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: >
          tenant_admin only; flag required. Archive generated state for exactly
          this scenario, retain base inputs, invalidate old leases, increment
          generation and append audit event. Never reset unrelated simulated data.
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DemoResetInput"}}}}
        responses:
          "200": {description: New scenario generation, content: {application/json: {schema: {$ref: "#/components/schemas/DemoScenario"}}}}
          "400": {$ref: "#/components/responses/BadRequest"}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
          "404": {$ref: "#/components/responses/NotFound"}
          "409": {$ref: "#/components/responses/Conflict"}
    ClaimWorkspace:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      get:
        operationId: getClaimWorkspace
        security: [{ClerkSession: []}]
        tags: [semantic]
        description: Institution-scoped claim topics, records, variants, observed links, and evidence lineage. Chronology and similarity are not proof of propagation.
        responses:
          "200": {description: Claim workspace, content: {application/json: {schema: {$ref: "#/components/schemas/ClaimWorkspace"}}}}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
    CreateClaimTopic:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      post:
        operationId: createClaimTopic
        security: [{ClerkSession: []}]
        tags: [semantic]
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateClaimTopicInput"}}}}
        responses:
          "201": {description: Topic, content: {application/json: {schema: {$ref: "#/components/schemas/ClaimTopic"}}}}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
    CreateClaim:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      post:
        operationId: createClaim
        security: [{ClerkSession: []}]
        tags: [semantic]
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateClaimInput"}}}}
        responses:
          "201": {description: Claim, content: {application/json: {schema: {$ref: "#/components/schemas/ClaimRecord"}}}}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
    CreateClaimVariant:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}, {name: claimId, in: path, required: true, schema: {type: string, format: uuid}}]
      post:
        operationId: createClaimVariant
        security: [{ClerkSession: []}]
        tags: [semantic]
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateClaimVariantInput"}}}}
        responses:
          "201": {description: Variant, content: {application/json: {schema: {$ref: "#/components/schemas/ClaimVariant"}}}}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
    LinkClaimObservation:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      post:
        operationId: linkClaimObservation
        security: [{ClerkSession: []}]
        tags: [semantic]
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LinkClaimObservationInput"}}}}
        responses:
          "201": {description: Manually linked observation, content: {application/json: {schema: {$ref: "#/components/schemas/ClaimObservation"}}}}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
    CreateClaimLineage:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      post:
        operationId: createClaimLineage
        security: [{ClerkSession: []}]
        tags: [semantic]
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateClaimLineageInput"}}}}
        responses:
          "201": {description: Human-recorded lineage edge, content: {application/json: {schema: {$ref: "#/components/schemas/ClaimLineage"}}}}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
    CreateClaimEvidence:
      parameters: [{$ref: "#/components/parameters/InstitutionId"}]
      post:
        operationId: createClaimEvidence
        security: [{ClerkSession: []}]
        tags: [semantic]
        requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateClaimEvidenceInput"}}}}
        responses:
          "201": {description: Evidence reference, content: {application/json: {schema: {$ref: "#/components/schemas/ClaimEvidence"}}}}
          "401": {$ref: "#/components/responses/Unauthorized"}
          "403": {$ref: "#/components/responses/Forbidden"}
  schemas:
    ClaimTopic:
      type: object
      required: [id, institutionId, title, normalizedKey, createdBy, createdAt, archivedAt]
      properties:
        id: {type: string, format: uuid}
        institutionId: {type: string, format: uuid}
        title: {type: string}
        normalizedKey: {type: string}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        archivedAt: {type: [string, "null"], format: date-time}
    ClaimRecord:
      type: object
      required: [id, institutionId, topicId, canonicalText, createdBy, createdAt, archivedAt]
      properties:
        id: {type: string, format: uuid}
        institutionId: {type: string, format: uuid}
        topicId: {type: string, format: uuid}
        canonicalText: {type: string}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        archivedAt: {type: [string, "null"], format: date-time}
    ClaimVariant:
      type: object
      required: [id, institutionId, claimId, variantText, language, createdBy, createdAt, archivedAt]
      properties:
        id: {type: string, format: uuid}
        institutionId: {type: string, format: uuid}
        claimId: {type: string, format: uuid}
        variantText: {type: string}
        language: {type: string, enum: [ar, en, und]}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        archivedAt: {type: [string, "null"], format: date-time}
    ClaimObservation:
      type: object
      required: [id, institutionId, variantId, observedContentId, datasetScope, relation, observedAt, recordedBy, recordedAt]
      properties:
        id: {type: string, format: uuid}
        institutionId: {type: string, format: uuid}
        variantId: {type: string, format: uuid}
        observedContentId: {type: string, format: uuid}
        datasetScope: {type: string, enum: [ordinary, simulated]}
        relation: {type: string, enum: [related, similar, quotes, contradicts]}
        observedAt: {type: string, format: date-time}
        recordedBy: {type: string}
        recordedAt: {type: string, format: date-time}
    ClaimLineage:
      type: object
      required: [id, institutionId, fromVariantId, toVariantId, relation, evidenceId, reason, recordedBy, recordedAt]
      properties:
        id: {type: string, format: uuid}
        institutionId: {type: string, format: uuid}
        fromVariantId: {type: string, format: uuid}
        toVariantId: {type: string, format: uuid}
        relation: {type: string, enum: [chronology, similarity, confirmed_propagation]}
        evidenceId: {type: [string, "null"], format: uuid}
        reason: {type: string}
        recordedBy: {type: string}
        recordedAt: {type: string, format: date-time}
    ClaimWorkspace:
      type: object
      required: [topics, claims, variants, observations, lineage, evidence]
      properties:
        topics: {type: array, items: {$ref: "#/components/schemas/ClaimTopic"}}
        claims: {type: array, items: {$ref: "#/components/schemas/ClaimRecord"}}
        variants: {type: array, items: {$ref: "#/components/schemas/ClaimVariant"}}
        observations: {type: array, items: {$ref: "#/components/schemas/ClaimObservation"}}
        lineage: {type: array, items: {$ref: "#/components/schemas/ClaimLineage"}}
        evidence: {type: array, items: {$ref: "#/components/schemas/ClaimEvidence"}}
    ClaimEvidence:
      type: object
      required: [id, institutionId, claimId, referenceId, referenceVersionNumber, observedContentId, caseId, semanticAnalysisId, note, recordedBy, recordedAt]
      properties:
        id: {type: string, format: uuid}
        institutionId: {type: string, format: uuid}
        claimId: {type: string, format: uuid}
        referenceId: {type: [string, "null"], format: uuid}
        referenceVersionNumber: {type: [integer, "null"]}
        observedContentId: {type: [string, "null"], format: uuid}
        caseId: {type: [string, "null"], format: uuid}
        semanticAnalysisId: {type: [string, "null"], format: uuid}
        note: {type: [string, "null"]}
        recordedBy: {type: string}
        recordedAt: {type: string, format: date-time}
    CreateClaimTopicInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 180}
    CreateClaimInput:
      type: object
      additionalProperties: false
      required: [topicId, canonicalText]
      properties:
        topicId: {type: string, format: uuid}
        canonicalText: {type: string, minLength: 1, maxLength: 4000}
    CreateClaimVariantInput:
      type: object
      additionalProperties: false
      required: [variantText, language]
      properties:
        variantText: {type: string, minLength: 1, maxLength: 4000}
        language: {type: string, enum: [ar, en, und]}
    LinkClaimObservationInput:
      type: object
      additionalProperties: false
      required: [variantId, observedContentId, relation]
      properties:
        variantId: {type: string, format: uuid}
        observedContentId: {type: string, format: uuid}
